<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наличие настоек</title>
    <style>
        body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #ffffff; 
    color: #333333; 
    margin: 0; 
    padding: 20px; 
}

h1 { 
    text-align: center; 
    color: #333333; 
}

.grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
    gap: 15px; 
    max-width: 1000px; 
    margin: 0 auto; 
}

.card { 
    background: #ffffff; 
    border-radius: 12px; 
    padding: 15px; 
    text-align: center; 
    border: 1px solid #dddddd;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.card.available { 
    border-color: #dddddd;
}

.card.unavailable { 
    opacity: 0.45; 
    border-color: #dddddd;
}

.name { 
    font-size: 16px; 
    font-weight: bold; 
    margin-bottom: 10px; 
    color: #333333;
}

.status { 
    font-size: 14px; 
    padding: 5px; 
    border-radius: 6px; 
    background: transparent;
    color: #333333;
}

.available .status { 
    background: transparent; 
    color: #333333; 
}

.unavailable .status { 
    background: transparent; 
    color: #333333; 
}

.loading { 
    text-align: center; 
    font-size: 20px; 
    margin-top: 50px; 
}
    </style>
</head>
<body>
   <div style="text-align: center; margin-bottom: 20px;">
    <img src="IMG_1224.png" alt="Логотип" style="max-width: 250px; height: auto; background: #ffffff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
</div>
    <div id="app" class="grid"><div class="loading">Загрузка меню...</div></div>

    <script type="module">
        // ИМПОРТ FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ВСТАВЬТЕ СЮДА ВАШ КОД ИЗ FIREBASE (который вы скопировали в Этапе 2)
        const firebaseConfig = {
          apiKey: "AIzaSyDv0R4ruzfogyFkZ0RhfgA8-gJJ4FzcpCY",
          authDomain: "ikraivodkispb.firebaseapp.com",
          projectId: "ikraivodkispb",
          storageBucket: "ikraivodkispb.firebasestorage.app",
          messagingSenderId: "686031842638",
          appId: "1:686031842638:web:454507ccaed8602833021f",
          measurementId: "G-9LH7WLJ4DX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appDiv = document.getElementById('app');

        // Следим за изменениями в базе в реальном времени
        onSnapshot(collection(db, "tinctures"), (snapshot) => {
            appDiv.innerHTML = '';
            if (snapshot.empty) {
                appDiv.innerHTML = '<div class="loading">Пока нет данных...</div>';
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = `card ${data.isAvailable ? 'available' : 'unavailable'}`;
                card.innerHTML = `
                    <div class="name">${data.name}</div>
                    <div class="status">${data.isAvailable ? '✅ В наличии' : '❌ Закончилась'}</div>
                `;
                appDiv.appendChild(card);
            });
        });
    </script>
</body>
</html>
