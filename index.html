<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наличие настоек</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #f1c40f; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .card { background: #2c3e50; border-radius: 12px; padding: 15px; text-align: center; transition: 0.3s; border: 2px solid #444; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card.available { border-color: #2ecc71; box-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }
        .card.unavailable { opacity: 0.5; border-color: #e74c3c; }
        .name { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .status { font-size: 14px; padding: 5px; border-radius: 6px; }
        .available .status { background: #27ae60; color: white; }
        .unavailable .status { background: #c0392b; color: white; }
        .loading { text-align: center; font-size: 20px; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>🍸 Наши настойки</h1>
    <div id="app" class="grid"><div class="loading">Загрузка меню...</div></div>

    <script type="module">
        // ИМПОРТ FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ВСТАВЬТЕ СЮДА ВАШ КОД ИЗ FIREBASE (который вы скопировали в Этапе 2)
       // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDv0R4ruzfogyFkZ0RhfgA8-gJJ4FzcpCY",
  authDomain: "ikraivodkispb.firebaseapp.com",
  projectId: "ikraivodkispb",
  storageBucket: "ikraivodkispb.firebasestorage.app",
  messagingSenderId: "686031842638",
  appId: "1:686031842638:web:454507ccaed8602833021f",
  measurementId: "G-9LH7WLJ4DX"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appDiv = document.getElementById('app');

        // Следим за изменениями в базе в реальном времени
        onSnapshot(collection(db, "tinctures"), (snapshot) => {
            appDiv.innerHTML = '';
            if (snapshot.empty) {
                appDiv.innerHTML = '<div class="loading">Пока нет данных...</div>';
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = `card ${data.isAvailable ? 'available' : 'unavailable'}`;
                card.innerHTML = `
                    <div class="name">${data.name}</div>
                    <div class="status">${data.isAvailable ? '✅ В наличии' : '❌ Закончилась'}</div>
                `;
                appDiv.appendChild(card);
            });
        });
    </script>
</body>
</html>
